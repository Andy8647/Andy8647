  <text x="24" y="100" font-size="15" clip-path="url(#c2)" xml:space="preserve"><tspan class="name">Andy Luo</tspan><tspan class="out"> — builds agents, and keeps them running</tspan></text>
  <text x="24" y="134" font-size="15" clip-path="url(#c3)" xml:space="preserve"><tspan class="prompt">❯ </tspan><tspan class="cmd">agent</tspan><tspan class="arg"> run</tspan><tspan class="flag"> --task</tspan><tspan class="str"> "ship it"</tspan><tspan class="flag"> --hours</tspan><tspan class="num"> 4</tspan></text>
  <text x="24" y="162" font-size="15" clip-path="url(#c4)" xml:space="preserve"><tspan class="icon"></tspan><tspan class="accent">  Agents</tspan><tspan class="dim">  ·  </tspan><tspan class="icon"></tspan><tspan class="accent">  Context engineering</tspan><tspan class="dim">  ·  </tspan><tspan class="icon"></tspan><tspan class="accent">  MCP</tspan><tspan class="dim">  ·  </tspan><tspan class="icon"></tspan><tspan class="accent">  Reliability</tspan></text>
  <text x="24" y="192" font-size="15" clip-path="url(#c5)" xml:space="preserve"><tspan class="ok">✔ </tspan><tspan class="out">rate limit hit </tspan><tspan class="arrow">→</tspan><tspan class="out"> waited for reset </tspan><tspan class="arrow">→</tspan><tspan class="out"> resumed</tspan></text>
  <text x="24" y="220" font-size="15" clip-path="url(#c6)" xml:space="preserve"><tspan class="ok">✔ </tspan><tspan class="out">plan split per task </tspan><tspan class="arrow">→</tspan><tspan class="out"> context stayed under budget</tspan></text>
