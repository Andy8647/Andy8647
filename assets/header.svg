  <style>
    @font-face { font-family: 'MapleMono'; font-weight: 400; font-style: normal; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'MapleMono'; font-weight: 700; font-style: normal; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'MapleMono'; font-weight: 400; font-style: italic; src: url(data:font/woff2;base64,) format('woff2'); }

    .terminal-bg { fill: #0d1117; }
    .title-bar { fill: #161b22; }
    .dot-red { fill: #ff5f57; }
    .dot-yellow { fill: #febc2e; }
    .dot-green { fill: #28c840; }
    .title-text { fill: #8b949e; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 12px; }
    .prompt { fill: #58a6ff; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 15px; font-weight: 700; }
    .command { fill: #c9d1d9; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 15px; }
    .output { fill: #7ee787; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 15px; }
    .comment { fill: #8b949e; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 14px; font-style: italic; }
    .accent { fill: #d2a8ff; font-family: 'MapleMono', 'Maple Mono NF', 'Maple Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; font-size: 15px; }
  </style>

  <!-- Terminal background -->
  <rect class="terminal-bg" width="800" height="220" rx="12" />

  <!-- Title bar -->
  <rect class="title-bar" width="800" height="36" rx="12" />
  <rect class="title-bar" width="800" height="16" y="20" />

  <!-- Window controls -->
