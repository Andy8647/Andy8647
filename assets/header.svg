  <circle class="dot-yellow" cx="40" cy="18" r="6" />
  <circle class="dot-green" cx="60" cy="18" r="6" />
  <text class="title-text" x="370" y="22" text-anchor="middle" xml:space="preserve">  andy@shanghai ~</text>

